{% extends "base.html" %}

{% block title %}
Login - AutoParts
{% endblock %}

{% block content %}

<h1>Login</h1>

<form class="card" method="POST" action="/login">

    <div>
        <label for="usuario">Usuário</label>
        <input
            id="usuario"
            name="usuario"
            type="text"
            required
        >
    </div>

    <div>
        <label for="senha">Senha</label>
        <input
            id="senha"
            name="senha"
            type="password"
            required
        >
    </div>

    <button type="submit">Entrar</button>

</form>

{% endblock %}
