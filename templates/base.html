<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <title>{% block title %}AutoParts{% endblock %}</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <aside class="sidebar">

        <div class="logo">
            <h2>AUTOPARTS</h2>
            <span>SYSTEM</span>
        </div>

        <nav>
            <a href="/">Painel</a>
            <a href="/cadastrar-veiculo">Veículos</a>

        </nav>

        <div class="sidebar-bottom">

        </div>

    </aside>

    <main class="content">

        {% block content %}

    <script src="{{ url_for('static', filename='script.js') }}"></script>

</body>
</html>
