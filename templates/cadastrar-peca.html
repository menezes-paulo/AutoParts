{% extends "base.html" %}

{% block title %}
Cadastrar Peça - AutoParts
{% endblock %}

{% block content %}

<h1>Cadastrar Peça</h1>

<form class="card" method="POST" action="/cadastrar-peca">

<div>
    <label for="titulo">Título</label>

    <input
        id="titulo"
        name="titulo"
        placeholder="Ex: Filtro de Óleo Motor"
        required
    >
</div>


<div>
    <label for="codigo_oem">Código Original</label>

    <input
        id="codigo_oem"
        name="codigo_oem"
        placeholder="Ex: 15400RTA003"
        required
    >
</div>


<div>
    <label for="marca">Marca</label>

    <input
        id="marca"
        name="marca"
        placeholder="Ex: Honda Genuína"
        required
    >
</div>


<div>
    <label for="preco">Preço</label>

    <input
        id="preco"
        name="preco"
        type="number"
        step="0.01"
        placeholder="Ex: 70.00"
        required
    >
</div>


<h2 class="titulo-aplicacoes">Selecione os motores compatíveis</h2>

<div class="campos-aplicacao">
    <div class="campo-aplicacao">
        <label for="motores">Lista de motores</label>

        <select id="motores" name="motores" multiple required>
            {% for motor in motores %}
                <option value="{{ motor.id }}">
                    {{ motor.nome }} - {{ motor.codigo }}
                </option>
            {% endfor %}
        </select>

        <small class="ajuda-campo">
            Para selecionar mais de um motor, segure Ctrl enquanto clica.
        </small>
    </div>
</div>

<button type="submit">
    Cadastrar Peça
</button>

</form>


{% endblock %}
